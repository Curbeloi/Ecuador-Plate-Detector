[project]
name = "smartguard"
version = "2.0.0"
description = "Seguridad para condominios: control de acceso por placas de Ecuador, conteo de vehículos y alertas"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pyside6>=6.12",
    "ultralytics>=8.4.178",
    "fast-plate-ocr[onnx]>=1.1.0",
    "open-image-models>=0.6.0",
    "onnxruntime>=1.31",
    "opencv-python>=4.10",
    "numpy>=2.2",
    "platformdirs>=4.13",
    "lap>=0.5.12",
]

[project.scripts]
smartguard = "smartguard.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-qt>=4.5",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smartguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pyright]
venvPath = "."
venv = ".venv"
